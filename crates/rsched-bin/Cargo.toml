[package]
name = "rusty-sched"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Autosys-class job scheduler with a Cronicle-style web UI — single binary, embedded SQLite."

[[bin]]
name = "rusty-sched"
path = "src/main.rs"

[dependencies]
rsched-agent = { path = "../rsched-agent" }
rsched-alert = { path = "../rsched-alert" }
rsched-api = { path = "../rsched-api" }
rsched-cli = { path = "../rsched-cli" }
rsched-core = { path = "../rsched-core" }
rsched-scheduler = { path = "../rsched-scheduler" }
rsched-store = { path = "../rsched-store" }
rsched-ui = { path = "../rsched-ui" }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
notify = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Native .rpm packaging (cargo-generate-rpm). `--target` rewrites the
# `target/release/...` source prefix to `target/<triple>/release/...`.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rusty-sched", dest = "/usr/bin/rusty-sched", mode = "755" },
    { source = "installers/systemd/rusty-sched-server.service", dest = "/usr/lib/systemd/system/rusty-sched-server.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/rusty-sched/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/rusty-sched/LICENSE", mode = "644" },
]
