<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rusty-sched</title>
<script>
  // Apply saved theme before paint to avoid flash.
  (function () {
    var t = localStorage.getItem('rsched_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ---------- Theme tokens ---------- */
:root[data-theme="light"] {
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-dim:#64748b; --text-faint:#94a3b8;
  --accent:#ea580c; --accent-2:#dc2626; --accent-fg:#ffffff; --accent-soft:#ffedd5;
  --success:#16a34a; --danger:#dc2626; --warning:#d97706; --running:#2563eb; --muted:#64748b;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --code-bg:#0f172a; --code-fg:#e2e8f0;
}
:root[data-theme="dark"] {
  --bg:#0b1120; --surface:#111827; --surface-2:#161f30; --surface-3:#1e293b;
  --border:#1f2a3c; --border-strong:#334155;
  --text:#e5edf7; --text-dim:#94a3b8; --text-faint:#64748b;
  --accent:#f97316; --accent-2:#ef4444; --accent-fg:#ffffff; --accent-soft:#3a2415;
  --success:#22c55e; --danger:#ef4444; --warning:#f59e0b; --running:#3b82f6; --muted:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --code-bg:#06090f; --code-fg:#cbd5e1;
}
:root[data-theme="midnight"] {
  --bg:#0a0a12; --surface:#13131f; --surface-2:#191926; --surface-3:#222234;
  --border:#262636; --border-strong:#3a3a52;
  --text:#e8e6f5; --text-dim:#9c98c0; --text-faint:#6b6890;
  --accent:#a78bfa; --accent-2:#7c3aed; --accent-fg:#0a0a12; --accent-soft:#241b3d;
  --success:#34d399; --danger:#fb7185; --warning:#fbbf24; --running:#60a5fa; --muted:#9c98c0;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --code-bg:#06060c; --code-fg:#cdcae8;
}
:root[data-theme="solarized"] {
  --bg:#fdf6e3; --surface:#fffbef; --surface-2:#f5eed5; --surface-3:#eee8d5;
  --border:#e6dfc4; --border-strong:#ccc4a8;
  --text:#073642; --text-dim:#657b83; --text-faint:#93a1a1;
  --accent:#268bd2; --accent-2:#2aa198; --accent-fg:#ffffff; --accent-soft:#dcebf5;
  --success:#859900; --danger:#dc322f; --warning:#b58900; --running:#268bd2; --muted:#657b83;
  --shadow:0 1px 3px rgba(7,54,66,.1);
  --code-bg:#073642; --code-fg:#eee8d5;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
button { font-family:inherit; cursor:pointer; }
input,select,textarea {
  font-family:inherit; font-size:13px; background:var(--surface-2); color:var(--text);
  border:1px solid var(--border-strong); border-radius:8px; padding:8px 10px; outline:none;
}
input:focus,select:focus,textarea:focus { border-color:var(--accent); }
::placeholder { color:var(--text-faint); }

/* ---------- Layout ---------- */
.app { display:flex; min-height:100vh; }
.sidebar {
  width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand { display:flex; align-items:center; gap:10px; padding:18px 18px 14px; }
.brand .logo {
  width:32px; height:32px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex; align-items:center; justify-content:center; color:var(--accent-fg);
  font-size:18px; box-shadow:var(--shadow);
}
.brand h1 { font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em; }
.brand .ver { font-size:11px; color:var(--text-faint); }
.nav { flex:1; padding:8px; overflow-y:auto; }
.nav-section { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); padding:14px 12px 6px; font-weight:600; }
.nav-item {
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:9px 12px; border:none; background:none; color:var(--text-dim);
  border-radius:9px; font-size:13.5px; font-weight:500; margin-bottom:2px;
}
.nav-item:hover { background:var(--surface-3); color:var(--text); }
.nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav-item svg { width:17px; height:17px; flex-shrink:0; }
.nav-item .badge { margin-left:auto; font-size:11px; background:var(--surface-3); color:var(--text-dim); padding:1px 7px; border-radius:999px; }
.sidebar-foot { padding:12px; border-top:1px solid var(--border); }

.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar {
  height:58px; flex-shrink:0; display:flex; align-items:center; gap:14px;
  padding:0 24px; border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:20;
}
.topbar .page-title { font-size:16px; font-weight:650; }
.topbar .spacer { flex:1; }
.content { padding:24px; max-width:1200px; width:100%; margin:0 auto; }

/* ---------- Bits ---------- */
.card { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
.card-pad { padding:18px; }
.row { display:flex; align-items:center; gap:10px; }
.btn {
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border-strong);
  background:var(--surface-2); color:var(--text); padding:8px 13px; border-radius:9px;
  font-size:13px; font-weight:550; transition:.12s;
}
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.btn-primary:hover { filter:brightness(1.07); color:var(--accent-fg); }
.btn-danger:hover { border-color:var(--danger); color:var(--danger); }
.btn-sm { padding:5px 10px; font-size:12px; border-radius:7px; }
.btn:disabled { opacity:.5; cursor:default; }
.icon-btn { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-dim); }
.icon-btn:hover { color:var(--accent); border-color:var(--accent); }
.icon-btn svg { width:17px; height:17px; }

.pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; text-transform:capitalize; }
.pill::before { content:""; width:6px; height:6px; border-radius:999px; background:currentColor; }
.pill.success { color:var(--success); background:color-mix(in srgb,var(--success) 14%,transparent); }
.pill.failed,.pill.lost,.pill.killed { color:var(--danger); background:color-mix(in srgb,var(--danger) 14%,transparent); }
.pill.running { color:var(--running); background:color-mix(in srgb,var(--running) 14%,transparent); }
.pill.queued,.pill.pending { color:var(--warning); background:color-mix(in srgb,var(--warning) 14%,transparent); }
.pill.paused,.pill.skipped,.pill.unknown { color:var(--muted); background:color-mix(in srgb,var(--muted) 16%,transparent); }

table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); }
tbody td { padding:11px 14px; border-bottom:1px solid var(--border); }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:var(--surface-2); }

.grid { display:grid; gap:16px; }
.stat { display:flex; flex-direction:column; gap:6px; }
.stat .label { font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
.stat .value { font-size:28px; font-weight:700; letter-spacing:-.02em; }
.stat .sub { font-size:12px; color:var(--text-faint); }

.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:12px; color:var(--text-dim); font-weight:550; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.4); width:100%; display:flex; flex-direction:column; max-height:90vh; }
.modal-head { display:flex; align-items:center; justify-content:between; padding:18px 20px; border-bottom:1px solid var(--border); }
.modal-body { padding:20px; overflow:auto; }
.modal-foot { padding:16px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
.alert-err { background:color-mix(in srgb,var(--danger) 12%,transparent); border:1px solid color-mix(in srgb,var(--danger) 35%,transparent); color:var(--danger); padding:9px 12px; border-radius:9px; font-size:13px; }
.console { background:var(--code-bg); color:var(--code-fg); border-radius:10px; padding:12px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; overflow:auto; max-height:340px; line-height:1.55; }
.dropdown { position:relative; }
.menu { position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:var(--shadow); padding:6px; min-width:170px; z-index:40; }
.menu button { display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:none; color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px; }
.menu button:hover { background:var(--surface-3); }
.menu .check { margin-left:auto; color:var(--accent); }
.toast-wrap { position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:100; }
.toast { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:9px; padding:11px 14px; box-shadow:0 8px 24px rgba(0,0,0,.25); font-size:13px; min-width:220px; }
.toast.err { border-left-color:var(--danger); }
.spark { display:flex; gap:2px; align-items:flex-end; height:18px; }
.spark span { width:5px; border-radius:1px; }
.empty { text-align:center; color:var(--text-faint); padding:40px 0; font-size:13.5px; }
.tag { font-size:11px; padding:2px 8px; border-radius:6px; background:var(--surface-3); color:var(--text-dim); font-weight:600; }
.progress { height:7px; background:var(--surface-3); border-radius:999px; overflow:hidden; flex:1; min-width:60px; }
.progress > div { height:100%; background:var(--accent); }
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
hr.sep { border:none; border-top:1px solid var(--border); margin:0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const API = "/api/v1";
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

/* ============ api helper ============ */
function api(method, path, body) {
  return fetch(API + path, {
    method,
    credentials: "same-origin",
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : null,
  }).then(async r => {
    if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
    return r.status === 204 ? null : r.json();
  });
}

/* ============ toasts ============ */
const ToastCtx = createContext(() => {});
function useToast() { return useContext(ToastCtx); }
function ToastHost({ children }) {
  const [items, setItems] = useState([]);
  const push = useCallback((msg, kind) => {
    const id = Math.random();
    setItems(x => [...x, { id, msg, kind }]);
    setTimeout(() => setItems(x => x.filter(i => i.id !== id)), 4000);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-wrap">
        {items.map(t => <div key={t.id} className={"toast " + (t.kind || "")}>{t.msg}</div>)}
      </div>
    </ToastCtx.Provider>
  );
}

/* ============ icons ============ */
const ICONS = {
  dashboard: "M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 14h7v7H3z",
  jobs: "M4 6h16M4 12h16M4 18h10",
  runs: "M5 3l14 9-14 9z",
  dag: "M6 3a3 3 0 100 6 3 3 0 000-6zM18 15a3 3 0 100 6 3 3 0 000-6zM6 21a3 3 0 100-6 3 3 0 000 6zM9 6h6a3 3 0 013 3v3",
  resources: "M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M3 12l9 4 9-4",
  globals: "M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18",
  users: "M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.87",
  keys: "M21 2l-2 2m-7.6 7.6a5 5 0 11-7-7 5 5 0 017 7zm0 0L15 15m0 0l3 3m-3-3l3-3",
  audit: "M9 11l3 3 8-8M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11",
  theme: "M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 01-4.4 2.26 5.4 5.4 0 01-3.4-9.6c-.36-.2-.74-.3-1.1-.3z",
  logout: "M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9",
  refresh: "M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0114.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0020.5 15",
  plus: "M12 5v14M5 12h14",
  play: "M5 3l14 9-14 9z",
  pause: "M6 4h4v16H6zM14 4h4v16h-4z",
  trash: "M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6",
  edit: "M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z",
  close: "M18 6L6 18M6 6l12 12",
  check: "M20 6L9 17l-5-5",
};
function Icon({ name, ...p }) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d={ICONS[name] || ""} />
    </svg>
  );
}

/* ============ themes ============ */
const THEMES = [
  { id: "light", name: "Light" },
  { id: "dark", name: "Dark" },
  { id: "midnight", name: "Midnight" },
  { id: "solarized", name: "Solarized" },
];
function useTheme() {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute("data-theme") || "dark");
  const apply = useCallback(t => {
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("rsched_theme", t);
    setTheme(t);
  }, []);
  return [theme, apply];
}
function ThemePicker({ theme, setTheme }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  return (
    <div className="dropdown" ref={ref}>
      <button className="icon-btn" title="Theme" onClick={() => setOpen(o => !o)}><Icon name="theme" /></button>
      {open && (
        <div className="menu">
          {THEMES.map(t => (
            <button key={t.id} onClick={() => { setTheme(t.id); setOpen(false); }}>
              {t.name}{theme === t.id && <span className="check"><Icon name="check" width="15" height="15" /></span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============ shared formatters ============ */
function fmtTime(t) { return t ? new Date(t).toLocaleString() : "—"; }
function fmtRel(t) {
  if (!t) return "—";
  const d = (Date.now() - new Date(t).getTime()) / 1000;
  const ab = Math.abs(d), fut = d < 0;
  const u = ab < 60 ? [ab, "s"] : ab < 3600 ? [ab/60, "m"] : ab < 86400 ? [ab/3600, "h"] : [ab/86400, "d"];
  const s = `${Math.round(u[0])}${u[1]}`;
  return fut ? `in ${s}` : `${s} ago`;
}
function outcomeColor(o) {
  return o === "success" ? "var(--success)" : o === "failure" ? "var(--danger)"
    : o === "running" ? "var(--running)" : "var(--muted)";
}
function Sparkline({ outcomes }) {
  if (!outcomes || !outcomes.length) return <span style={{color:"var(--text-faint)",fontSize:12}}>no runs</span>;
  return (
    <div className="spark">
      {outcomes.map((o, i) => <span key={i} title={o} style={{ height: "100%", background: outcomeColor(o) }} />)}
    </div>
  );
}

/* ============ Dashboard ============ */
function Dashboard({ go }) {
  const [jobs, setJobs] = useState(null);
  const [stats, setStats] = useState({});
  async function load() {
    const js = await api("GET", "/jobs");
    setJobs(js);
    const entries = await Promise.all(js.map(async j => {
      try { return [j.id, await api("GET", `/stats/jobs/${j.id}`)]; } catch { return [j.id, null]; }
    }));
    setStats(Object.fromEntries(entries));
  }
  useEffect(() => { load(); const id = setInterval(load, 8000); return () => clearInterval(id); }, []);
  if (!jobs) return <div className="empty">loading…</div>;

  const paused = jobs.filter(j => j.paused).length;
  const allOut = Object.values(stats).flatMap(s => s ? s.recent_outcomes || [] : []);
  const running = allOut.filter(o => o === "running").length;
  const succ = allOut.filter(o => o === "success").length;
  const fail = allOut.filter(o => o === "failure").length;
  const rate = (succ + fail) ? Math.round(succ / (succ + fail) * 100) : 100;
  const upcoming = jobs.filter(j => j.next_fire_at && !j.paused)
    .sort((a, b) => new Date(a.next_fire_at) - new Date(b.next_fire_at)).slice(0, 6);
  const recentFails = jobs.map(j => ({ j, s: stats[j.id] }))
    .filter(x => x.s && x.s.last_failure_at)
    .sort((a, b) => new Date(b.s.last_failure_at) - new Date(a.s.last_failure_at)).slice(0, 6);

  const Stat = ({ label, value, sub, color }) => (
    <div className="card card-pad stat">
      <span className="label">{label}</span>
      <span className="value" style={color ? { color } : null}>{value}</span>
      {sub && <span className="sub">{sub}</span>}
    </div>
  );
  return (
    <div className="grid" style={{ gap: 18 }}>
      <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))" }}>
        <Stat label="Jobs" value={jobs.length} sub={`${paused} paused`} />
        <Stat label="Running now" value={running} color="var(--running)" />
        <Stat label="Success rate" value={rate + "%"} sub="recent window" color={rate >= 90 ? "var(--success)" : rate >= 70 ? "var(--warning)" : "var(--danger)"} />
        <Stat label="Failures" value={fail} color={fail ? "var(--danger)" : null} sub="recent window" />
      </div>
      <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(340px,1fr))" }}>
        <div className="card">
          <div className="card-pad" style={{ paddingBottom: 8, fontWeight: 650 }}>Upcoming runs</div>
          <hr className="sep" />
          {upcoming.length === 0 && <div className="empty" style={{ padding: 24 }}>nothing scheduled</div>}
          {upcoming.map(j => (
            <div key={j.id} className="row" style={{ padding: "10px 18px", borderBottom: "1px solid var(--border)", cursor: "pointer" }} onClick={() => go("jobs")}>
              <span style={{ fontWeight: 550 }}>{j.name}</span>
              <span className="tag mono">{j.trigger.kind}</span>
              <span className="spacer" style={{ flex: 1 }} />
              <span style={{ color: "var(--text-dim)", fontSize: 12.5 }}>{fmtRel(j.next_fire_at)}</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-pad" style={{ paddingBottom: 8, fontWeight: 650 }}>Recent failures</div>
          <hr className="sep" />
          {recentFails.length === 0 && <div className="empty" style={{ padding: 24 }}>no recent failures 🎉</div>}
          {recentFails.map(({ j, s }) => (
            <div key={j.id} className="row" style={{ padding: "10px 18px", borderBottom: "1px solid var(--border)", cursor: "pointer" }} onClick={() => go("jobs")}>
              <span style={{ fontWeight: 550 }}>{j.name}</span>
              <span className="spacer" style={{ flex: 1 }} />
              <span className="pill failed">failed</span>
              <span style={{ color: "var(--text-faint)", fontSize: 12 }}>{fmtRel(s.last_failure_at)}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============ Run detail (live logs) ============ */
function RunDetail({ runId }) {
  const [logs, setLogs] = useState([]);
  const [run, setRun] = useState(null);
  const [live, setLive] = useState(false);
  async function meta() { try { setRun(await api("GET", `/runs/${runId}`)); } catch {} }
  useEffect(() => {
    setLogs([]); meta();
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/api/v1/runs/${runId}/logs/ws?from_seq=0`);
    ws.onopen = () => setLive(true);
    ws.onclose = () => { setLive(false); meta(); };
    ws.onerror = () => setLive(false);
    ws.onmessage = ev => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === "log") setLogs(p => [...p, m]);
        else if (m.type === "end") { setLive(false); meta(); }
      } catch {}
    };
    const t = setInterval(meta, 4000);
    return () => { clearInterval(t); try { ws.close(); } catch {} };
  }, [runId]);
  return (
    <div style={{ marginTop: 12 }}>
      {run && (
        <div className="row" style={{ flexWrap: "wrap", gap: 14, fontSize: 12.5, color: "var(--text-dim)", marginBottom: 8 }}>
          <span className={"pill " + run.state}>{run.state}</span>
          {live && <span className="pill running">live</span>}
          <span>attempt {run.attempt}</span>
          {run.exit_code != null && <span>exit {run.exit_code}</span>}
          {run.peak_rss_bytes ? <span>RSS {(run.peak_rss_bytes/1048576).toFixed(1)} MB</span> : null}
          {(run.cpu_user_secs != null || run.cpu_sys_secs != null) && <span>CPU {((run.cpu_user_secs||0)+(run.cpu_sys_secs||0)).toFixed(2)}s</span>}
          {run.log_truncated && <span style={{ color: "var(--warning)" }}>truncated</span>}
        </div>
      )}
      <div className="console">
        {logs.length === 0 && <span style={{ color: "var(--text-faint)" }}>no output yet…</span>}
        {logs.map((l, i) => <div key={i} style={{ color: l.stream === "stderr" ? "var(--danger)" : "var(--code-fg)" }}>{l.chunk}</div>)}
      </div>
    </div>
  );
}

/* ============ Job card ============ */

  useEffect(() => {
    let on = true;
    const f = async () => { try { const s = await api("GET", `/stats/jobs/${job.id}`); if (on) setStats(s); } catch {} };
    f(); const id = setInterval(f, 10000); return () => { on = false; clearInterval(id); };

    try { await api("POST", `/jobs/${job.id}/${path}`); toast(`${job.name}: ${label}`); onChange(); }

            {job.next_fire_at && <span>next <b style={{ color: "var(--text-dim)" }}>{fmtRel(job.next_fire_at)}</b></span>}

          <Sparkline outcomes={stats.recent_outcomes} />
          <span><b style={{ color: "var(--text)" }}>{Math.round(stats.success_rate_24h * 100)}%</b> 24h</span>
          <span>p50 {stats.p50_duration_secs.toFixed(1)}s</span>
          <span>p99 {stats.p99_duration_secs.toFixed(1)}s</span>
          <span className="spacer" style={{ flex: 1 }} />
          <button className="btn btn-sm" onClick={toggleRuns}>{runs ? "Hide runs" : "Runs"}</button>

      )}

        <div style={{ marginTop: 12 }}>
          {runs.length === 0 && <div className="empty" style={{ padding: 16 }}>no runs yet</div>}
          {runs.map(r => (
            <div key={r.id}>
              <div className="row" style={{ gap: 12, padding: "7px 0", borderBottom: "1px solid var(--border)", fontSize: 12.5 }}>
                <span className={"pill " + r.state}>{r.state}</span>

              </div>

    </div>
  );
}

/* ============ Job builder (GUI → validated JSON) ============ */
const SHELLS = ["auto", "sh", "bash", "cmd", "powershell", "none", "plugin"];
const TRIGGER_KINDS = ["cron", "interval", "one_shot", "manual", "file", "webhook", "condition"];
const FILE_EVENTS = ["any", "create", "modify", "delete"];

function blankBuilder() {
  return {
    name: "", cmd: "echo hello", shell: "auto", cwd: "",
    triggerKind: "cron",
    cron: { expr: "*/5 * * * *", timezone: "" },
    interval: { every: 300 },
    oneshot: { at: "" },
    file: { path: "", event: "any" },
    webhook: { slug: "", secret: "" },
    condition: { expr: "" },
    args: [], env: [],
    timeout_secs: 0, sla_secs: 0,
    retry: { max_attempts: 1, backoffKind: "none", delay_secs: 30, base_secs: 10, max_secs: 300 },
    misfire: "fire_once",
  };
}

// Pure: builder state -> job request object (matches POST /jobs).
function buildJob(f) {
  let trigger;
  switch (f.triggerKind) {
    case "cron": trigger = { kind: "cron", expr: f.cron.expr, ...(f.cron.timezone ? { timezone: f.cron.timezone } : {}) }; break;
    case "interval": trigger = { kind: "interval", every: Number(f.interval.every) || 0, start_at: null }; break;
    case "one_shot": trigger = { kind: "one_shot", at: f.oneshot.at ? new Date(f.oneshot.at).toISOString() : "" }; break;
    case "file": trigger = { kind: "file", path: f.file.path, event: f.file.event }; break;
    case "webhook": trigger = { kind: "webhook", slug: f.webhook.slug, secret: f.webhook.secret }; break;
    case "condition": trigger = { kind: "condition", expr: f.condition.expr }; break;
    default: trigger = { kind: "manual" };
  }
  let backoff;
  if (f.retry.backoffKind === "fixed") backoff = { kind: "fixed", delay_secs: Number(f.retry.delay_secs) || 0 };
  else if (f.retry.backoffKind === "exponential") backoff = { kind: "exponential", base_secs: Number(f.retry.base_secs) || 0, max_secs: Number(f.retry.max_secs) || 0 };
  else backoff = { kind: "none" };
  const env = {};
  f.env.forEach(({ k, v }) => { if (k) env[k] = v; });
  return {
    name: f.name, trigger, cmd: f.cmd,
    args: f.args.filter(a => a !== ""),
    env, cwd: f.cwd || null, shell: f.shell,
    timeout_secs: Number(f.timeout_secs) || 0,
    sla_secs: Number(f.sla_secs) || 0,
    retry: { max_attempts: Number(f.retry.max_attempts) || 1, backoff },
    misfire: f.misfire,
  };
}

// Pure: returns { field: message } for any invalid input.
function validateBuilder(f) {
  const e = {};
  if (!f.name.trim()) e.name = "name required";
  else if (!/^[\w.\-:]+$/.test(f.name)) e.name = "letters, digits, . _ - : only";
  if (!f.cmd.trim()) e.cmd = "command required";
  if (f.triggerKind === "cron") {
    const parts = f.cron.expr.trim().split(/\s+/);
    if (!f.cron.expr.trim()) e.trigger = "cron expression required";
    else if (parts.length !== 5 && parts.length !== 6) e.trigger = "cron needs 5 or 6 fields";
  } else if (f.triggerKind === "interval") {
    if (!(Number(f.interval.every) > 0)) e.trigger = "interval must be > 0 seconds";
  } else if (f.triggerKind === "one_shot") {
    if (!f.oneshot.at) e.trigger = "pick a date/time";
  } else if (f.triggerKind === "file") {
    if (!f.file.path.trim()) e.trigger = "file path required";
  } else if (f.triggerKind === "webhook") {
    if (f.webhook.slug.length < 8) e.trigger = "slug must be ≥ 8 chars";
    else if (f.webhook.secret.length < 16) e.trigger = "secret must be ≥ 16 chars";
  } else if (f.triggerKind === "condition") {
    if (!f.condition.expr.trim()) e.trigger = "condition expression required";
  }
  const ma = Number(f.retry.max_attempts);
  if (!(ma >= 1 && ma <= 100)) e.retry = "max attempts 1–100";
  if (Number(f.timeout_secs) < 0) e.timeout = "timeout ≥ 0";
  if (Number(f.sla_secs) < 0) e.sla = "sla ≥ 0";
  const seen = new Set();
  for (const { k } of f.env) { if (k && seen.has(k)) { e.env = `duplicate env key "${k}"`; break; } if (k) seen.add(k); }
  return e;
}

function JobBuilder({ onClose, onCreated }) {
  const toast = useToast();
  const [f, setF] = useState(blankBuilder);
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  const setIn = (group, k, v) => setF(x => ({ ...x, [group]: { ...x[group], [k]: v } }));

  const job = buildJob(f);
  const errs = validateBuilder(f);
  const valid = Object.keys(errs).length === 0;
  const json = JSON.stringify(job, null, 2);

  // env / args row helpers
  const addEnv = () => set("env", [...f.env, { k: "", v: "" }]);
  const setEnv = (i, key, val) => set("env", f.env.map((r, j) => j === i ? { ...r, [key]: val } : r));
  const delEnv = i => set("env", f.env.filter((_, j) => j !== i));
  const addArg = () => set("args", [...f.args, ""]);
  const setArg = (i, val) => set("args", f.args.map((a, j) => j === i ? val : a));
  const delArg = i => set("args", f.args.filter((_, j) => j !== i));

  async function create() {
    if (!valid) return;
    setBusy(true);
    try { await api("POST", "/jobs", job); toast(`created ${f.name}`); onCreated(); onClose(); }
    catch (e) { toast(e.message, "err"); setBusy(false); }
  }
  function copy() { navigator.clipboard.writeText(json).then(() => toast("JSON copied")); }

  const Err = ({ k }) => errs[k] ? <span style={{ color: "var(--danger)", fontSize: 11.5 }}>{errs[k]}</span> : null;

  return (
    <div className="modal-backdrop" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 920 }}>
        <div className="modal-head row"><span style={{ fontWeight: 650, fontSize: 15 }}>Job builder</span><span style={{ flex: 1 }} /><button className="icon-btn" onClick={onClose}><Icon name="close" /></button></div>
        <div className="modal-body" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          {/* ---- form ---- */}
          <div className="grid" style={{ gap: 12, alignContent: "start" }}>
            <div className="field"><label>Name <Err k="name" /></label><input value={f.name} onChange={e => set("name", e.target.value)} placeholder="nightly-etl" /></div>
            <div className="field"><label>Command <Err k="cmd" /></label><input className="mono" value={f.cmd} onChange={e => set("cmd", e.target.value)} /></div>
            <div className="row" style={{ gap: 10 }}>
              <div className="field" style={{ flex: 1 }}><label>Shell</label><select value={f.shell} onChange={e => set("shell", e.target.value)}>{SHELLS.map(s => <option key={s}>{s}</option>)}</select></div>
              <div className="field" style={{ flex: 1 }}><label>Working dir</label><input value={f.cwd} onChange={e => set("cwd", e.target.value)} placeholder="(optional)" /></div>
            </div>

            <div className="field"><label>Trigger <Err k="trigger" /></label>
              <select value={f.triggerKind} onChange={e => set("triggerKind", e.target.value)}>{TRIGGER_KINDS.map(t => <option key={t} value={t}>{t}</option>)}</select>
            </div>
            {f.triggerKind === "cron" && (
              <div className="row" style={{ gap: 10 }}>
                <div className="field" style={{ flex: 2 }}><label>Cron expression</label><input className="mono" value={f.cron.expr} onChange={e => setIn("cron", "expr", e.target.value)} /></div>
                <div className="field" style={{ flex: 1 }}><label>Timezone</label><input value={f.cron.timezone} onChange={e => setIn("cron", "timezone", e.target.value)} placeholder="UTC" /></div>
              </div>
            )}
            {f.triggerKind === "interval" && <div className="field"><label>Every (seconds)</label><input type="number" min="1" value={f.interval.every} onChange={e => setIn("interval", "every", e.target.value)} /></div>}
            {f.triggerKind === "one_shot" && <div className="field"><label>Fire at</label><input type="datetime-local" value={f.oneshot.at} onChange={e => setIn("oneshot", "at", e.target.value)} /></div>}
            {f.triggerKind === "file" && (
              <div className="row" style={{ gap: 10 }}>
                <div className="field" style={{ flex: 2 }}><label>Path</label><input className="mono" value={f.file.path} onChange={e => setIn("file", "path", e.target.value)} placeholder="/data/incoming" /></div>
                <div className="field" style={{ flex: 1 }}><label>Event</label><select value={f.file.event} onChange={e => setIn("file", "event", e.target.value)}>{FILE_EVENTS.map(ev => <option key={ev}>{ev}</option>)}</select></div>
              </div>
            )}
            {f.triggerKind === "webhook" && (
              <div className="row" style={{ gap: 10 }}>
                <div className="field" style={{ flex: 1 }}><label>Slug (≥8)</label><input className="mono" value={f.webhook.slug} onChange={e => setIn("webhook", "slug", e.target.value)} /></div>
                <div className="field" style={{ flex: 1 }}><label>Secret (≥16)</label><input className="mono" value={f.webhook.secret} onChange={e => setIn("webhook", "secret", e.target.value)} /></div>
              </div>
            )}
            {f.triggerKind === "condition" && <div className="field"><label>Condition expr</label><input className="mono" value={f.condition.expr} onChange={e => setIn("condition", "expr", e.target.value)} placeholder="success(jobA) and value(IS_RUN_DAY)" /></div>}

            <div className="field"><label>Arguments</label>
              {f.args.map((a, i) => <div key={i} className="row" style={{ gap: 6, marginBottom: 6 }}><input className="mono" style={{ flex: 1 }} value={a} onChange={e => setArg(i, e.target.value)} /><button className="icon-btn" onClick={() => delArg(i)}><Icon name="trash" /></button></div>)}
              <button className="btn btn-sm" onClick={addArg}><Icon name="plus" width="13" height="13" />Add arg</button>
            </div>
            <div className="field"><label>Environment <Err k="env" /></label>
              {f.env.map((r, i) => <div key={i} className="row" style={{ gap: 6, marginBottom: 6 }}><input style={{ flex: 1 }} placeholder="KEY" value={r.k} onChange={e => setEnv(i, "k", e.target.value)} /><input className="mono" style={{ flex: 1 }} placeholder="value" value={r.v} onChange={e => setEnv(i, "v", e.target.value)} /><button className="icon-btn" onClick={() => delEnv(i)}><Icon name="trash" /></button></div>)}
              <button className="btn btn-sm" onClick={addEnv}><Icon name="plus" width="13" height="13" />Add var</button>
            </div>

            <div className="row" style={{ gap: 10 }}>
              <div className="field" style={{ flex: 1 }}><label>Timeout (s, 0=∞) <Err k="timeout" /></label><input type="number" min="0" value={f.timeout_secs} onChange={e => set("timeout_secs", e.target.value)} /></div>
              <div className="field" style={{ flex: 1 }}><label>SLA (s) <Err k="sla" /></label><input type="number" min="0" value={f.sla_secs} onChange={e => set("sla_secs", e.target.value)} /></div>
            </div>
            <div className="row" style={{ gap: 10 }}>
              <div className="field" style={{ flex: 1 }}><label>Max attempts <Err k="retry" /></label><input type="number" min="1" max="100" value={f.retry.max_attempts} onChange={e => setIn("retry", "max_attempts", e.target.value)} /></div>
              <div className="field" style={{ flex: 1 }}><label>Backoff</label><select value={f.retry.backoffKind} onChange={e => setIn("retry", "backoffKind", e.target.value)}><option value="none">none</option><option value="fixed">fixed</option><option value="exponential">exponential</option></select></div>
            </div>
            {f.retry.backoffKind === "fixed" && <div className="field" style={{ maxWidth: 200 }}><label>Delay (s)</label><input type="number" min="0" value={f.retry.delay_secs} onChange={e => setIn("retry", "delay_secs", e.target.value)} /></div>}
            {f.retry.backoffKind === "exponential" && (
              <div className="row" style={{ gap: 10 }}>
                <div className="field" style={{ flex: 1 }}><label>Base (s)</label><input type="number" min="0" value={f.retry.base_secs} onChange={e => setIn("retry", "base_secs", e.target.value)} /></div>
                <div className="field" style={{ flex: 1 }}><label>Max (s)</label><input type="number" min="0" value={f.retry.max_secs} onChange={e => setIn("retry", "max_secs", e.target.value)} /></div>
              </div>
            )}
            <div className="field"><label>Misfire policy</label><select value={f.misfire} onChange={e => set("misfire", e.target.value)}><option value="fire_once">fire_once</option><option value="skip">skip</option><option value="fire_all_missed">fire_all_missed</option></select></div>
          </div>

          {/* ---- live JSON ---- */}
          <div className="grid" style={{ gap: 10, alignContent: "start" }}>
            <div className="row"><label style={{ fontSize: 12, color: "var(--text-dim)", fontWeight: 550 }}>Generated job JSON</label><span className="spacer" style={{ flex: 1 }} />
              <span className={"pill " + (valid ? "success" : "failed")}>{valid ? "valid" : Object.keys(errs).length + " issue(s)"}</span>
            </div>
            <pre className="console" style={{ maxHeight: 420, margin: 0, whiteSpace: "pre" }}>{json}</pre>
            {!valid && (
              <div className="alert-err">
                <ul style={{ margin: 0, paddingLeft: 18 }}>{Object.entries(errs).map(([k, v]) => <li key={k}>{v}</li>)}</ul>
              </div>
            )}
            <button className="btn btn-sm" onClick={copy} style={{ alignSelf: "start" }}><Icon name="keys" width="13" height="13" />Copy JSON</button>
          </div>
        </div>
        <div className="modal-foot"><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={!valid || busy} onClick={create}>{busy ? "Creating…" : "Create job"}</button></div>
      </div>
    </div>
  );
}

/* ============ Edit job (raw JSON) ============ */
function JobEditModal({ job, onClose, onSaved }) {
  const toast = useToast();
  const [text, setText] = useState(() => JSON.stringify(job, null, 2));
  const [busy, setBusy] = useState(false);
  async function save() {
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { toast("Invalid JSON: " + e.message, "err"); return; }
    setBusy(true);
    try { await api("PUT", `/jobs/${job.id}`, parsed); toast("saved"); onSaved(); }
    catch (e) { toast(e.message, "err"); setBusy(false); }
  }
  return (
    <div className="modal-backdrop" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 640 }}>
        <div className="modal-head row"><span style={{ fontWeight: 650, fontSize: 15 }}>Edit <span style={{ color: "var(--accent)" }}>{job.name}</span></span><span style={{ flex: 1 }} /><button className="icon-btn" onClick={onClose}><Icon name="close" /></button></div>
        <div className="modal-body">
          <textarea className="mono" style={{ width: "100%", height: 380, resize: "vertical", lineHeight: 1.5 }} value={text} onChange={e => setText(e.target.value)} spellCheck={false} />
        </div>
        <div className="modal-foot"><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={busy} onClick={save}>{busy ? "Saving…" : "Save"}</button></div>
      </div>
    </div>
  );
}

  useEffect(() => { load(); const id = setInterval(load, 6000); return () => clearInterval(id); }, []);

/* ============ DAG page ============ */
function layoutDag(jobs) {
  const NW = 150, NH = 42, CG = 90, RG = 26, BP = 18, M = 40;
  const byId = new Map(jobs.map(j => [j.id, j]));
  const down = new Map(), indeg = new Map();
  jobs.forEach(j => { indeg.set(j.id, 0); down.set(j.id, []); });
  jobs.forEach(j => (j.dependencies || []).forEach(d => {
    if (!byId.has(d.upstream)) return;
    down.get(d.upstream).push(j.id); indeg.set(j.id, indeg.get(j.id) + 1);
  }));
  const layer = new Map(); jobs.forEach(j => layer.set(j.id, 0));
  const q = []; indeg.forEach((d, id) => d === 0 && q.push(id));
  const seen = new Set();
  while (q.length) {
    const id = q.shift(); if (seen.has(id)) continue; seen.add(id);
    const c = layer.get(id);
    (down.get(id) || []).forEach(n => { if (layer.get(n) < c + 1) layer.set(n, c + 1); q.push(n); });
  }
  const layers = new Map();
  jobs.forEach(j => { const L = layer.get(j.id) || 0; if (!layers.has(L)) layers.set(L, []); layers.get(L).push(j); });
  const keys = [...layers.keys()].sort((a, b) => a - b);
  const nodes = [], pos = new Map();
  keys.forEach(L => layers.get(L).forEach((j, i) => {
    const n = { id: j.id, name: j.name, x: M + L * (NW + CG), y: M + i * (NH + RG), state: j._state || "unknown" };
    nodes.push(n); pos.set(j.id, n);
  }));
  const edges = [];
  jobs.forEach(j => (j.dependencies || []).forEach(d => {
    if (pos.has(d.upstream) && pos.has(j.id)) edges.push({ from: d.upstream, to: j.id });
  }));
  const width = nodes.length ? Math.max(...nodes.map(n => n.x + NW)) + M : 300;
  const height = nodes.length ? Math.max(...nodes.map(n => n.y + NH)) + M : 200;
  return { nodes, edges, width, height, NW, NH };
}
function dagFill(s) {
  return s === "success" ? "var(--success)" : (s === "failed" || s === "lost" || s === "killed") ? "var(--danger)"
    : s === "running" ? "var(--running)" : s === "queued" || s === "pending" ? "var(--warning)" : "var(--muted)";
}
function DagPage() {
  const [jobs, setJobs] = useState(null);
  async function load() {
    const js = await api("GET", "/jobs");
    const enr = await Promise.all(js.map(async j => {
      try { const s = await api("GET", `/stats/jobs/${j.id}`); const last = (s.recent_outcomes || []).slice(-1)[0];
        return { ...j, _state: last === "success" ? "success" : last === "failure" ? "failed" : last === "running" ? "running" : "unknown" };
      } catch { return { ...j, _state: "unknown" }; }
    }));
    setJobs(enr);
  }
  useEffect(() => { load(); const id = setInterval(load, 5000); return () => clearInterval(id); }, []);
  if (!jobs) return <div className="empty">loading…</div>;
  if (!jobs.length) return <div className="card card-pad empty">No jobs to graph.</div>;
  const d = layoutDag(jobs);
  const idx = new Map(d.nodes.map(n => [n.id, n]));
  const path = (f, t) => { const x1 = f.x + d.NW, y1 = f.y + d.NH / 2, x2 = t.x, y2 = t.y + d.NH / 2, dx = Math.max(40, (x2 - x1) / 2); return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`; };
  return (
    <div className="card card-pad" style={{ overflow: "auto" }}>
      <div className="row" style={{ marginBottom: 12, gap: 14, fontSize: 12, color: "var(--text-dim)" }}>
        <span>{jobs.length} jobs · {d.edges.length} edges</span>
        <span className="spacer" style={{ flex: 1 }} />
        {["success", "failed", "running", "unknown"].map(s => <span key={s} className="row" style={{ gap: 5 }}><span style={{ width: 10, height: 10, borderRadius: 3, background: dagFill(s) }} />{s}</span>)}
      </div>
      <svg width="100%" viewBox={`0 0 ${d.width} ${d.height}`} style={{ minWidth: d.width, maxWidth: "100%", height: "auto" }}>
        <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--border-strong)" /></marker></defs>
        {d.edges.map((e, i) => { const f = idx.get(e.from), t = idx.get(e.to); return f && t ? <path key={i} d={path(f, t)} fill="none" stroke="var(--border-strong)" strokeWidth="1.5" markerEnd="url(#arr)" /> : null; })}
        {d.nodes.map(n => (
          <g key={n.id}>
            <rect x={n.x} y={n.y} width={d.NW} height={d.NH} rx="9" fill={dagFill(n.state)} />
            <text x={n.x + d.NW / 2} y={n.y + d.NH / 2 + 4} textAnchor="middle" fontSize="12" fontWeight="600" fill="#fff">{n.name.length > 18 ? n.name.slice(0, 17) + "…" : n.name}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

/* ============ Login ============ */
function Login({ onLoggedIn }) {
  const [u, setU] = useState("admin");
  const [p, setP] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  async function submit(e) {
    e.preventDefault(); setErr(null); setBusy(true);
    try {
      const r = await fetch(API + "/auth/login", { method: "POST", headers: { "content-type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ username: u, password: p }) });
      if (!r.ok) { setErr("invalid credentials"); setBusy(false); return; }
      onLoggedIn(await r.json());
    } catch (e) { setErr(e.message); setBusy(false); }
  }
  return (
    <div className="login-wrap">
      <form className="card card-pad" style={{ width: 360 }} onSubmit={submit}>
        <div className="brand" style={{ padding: "0 0 18px" }}>
          <div className="logo">⚙</div>
          <div><h1>rusty-sched</h1><div className="ver">job scheduler</div></div>
        </div>
        <div className="field" style={{ marginBottom: 12 }}><label>Username</label><input value={u} onChange={e => setU(e.target.value)} required /></div>
        <div className="field" style={{ marginBottom: 16 }}><label>Password</label><input type="password" value={p} onChange={e => setP(e.target.value)} required /></div>
        <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center" }} disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
        {err && <div className="alert-err" style={{ marginTop: 12 }}>{err}</div>}
        <p style={{ fontSize: 12, color: "var(--text-faint)", marginTop: 16 }}>Default user <span className="mono">admin</span>. Password from <span className="mono">RSCHED_ADMIN_PASSWORD</span> or auto-generated (see server logs).</p>
      </form>
    </div>
  );
}

  }

  return (

                <Icon name={n.icon} /> {n.label}

            );
          })}

        <div className="sidebar-foot">
          <a href="https://github.com/jdp5949/rusty-sched" className="nav-item" style={{ color: "var(--text-dim)" }}>★ GitHub</a>
        </div>
      </aside>
      <div className="main">
        <header className="topbar">
          <span className="page-title">{TITLES[tab]}</span>
          <span className="spacer" />
          <ThemePicker theme={theme} setTheme={setTheme} />
          <div className="dropdown">
            <button className="btn btn-sm" onClick={() => setMenuOpen(o => !o)}>{me.username} <span className="tag">{me.role}</span></button>

          </div>
        </header>
        <div className="content">{page}</div>
      </div>
    </div>
  );
}
